<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- added to the home screen on iOS it opens full screen, without Safari's own back swipe (D78) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Arborism</title>
<link rel="icon" href="data:,">
<style>
  /* overscroll-behavior: none stops pull-to-refresh and the overscroll swipe-back of Chrome / Edge (touch and
     trackpad); touch-action: none on the canvas keeps the browser from panning or zooming under a finger (D78) */
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1b2418; color: #fff; font: 15px/1.35 system-ui, sans-serif; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #status { top: 8px; left: 10px; font-size: 13px; }
  #prog { top: 28px; left: 10px; font-size: 14px; font-weight: 600; }
  #net { top: 30px; right: 10px; font-size: 12px; white-space: pre; text-align: right; display: none; opacity: .9; }
  #prompt { bottom: 58px; left: 0; right: 0; text-align: center; font-size: 18px; font-weight: 600; }
  #rope { bottom: 30px; left: 0; right: 0; text-align: center; font-size: 15px; display: none; color: #ffe9a8; }
  #toasts { top: 40px; left: 0; right: 0; text-align: center; font-size: 17px; }
  #toasts div { margin: 2px auto; background: rgba(0,0,0,.45); display: table; padding: 3px 12px; border-radius: 4px; }
  #cross { top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; opacity: .8; }
  #ring { top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px; transform: rotate(-90deg); }
  #keys { left: 10px; bottom: 8px; font-size: 12px; opacity: .8; }
  #menu { overscroll-behavior: contain; position: fixed; z-index: 10; top: 0; right: 0; bottom: 0; width: min(96vw, 560px); overflow-y: auto; display: none;
          background: rgba(18,24,16,.93); padding: 14px 18px; box-sizing: border-box; font-size: 13.5px; }
  #menu h2 { margin: 0 0 4px; } #menu h3 { margin: 16px 0 6px; color: #e8a23a; font-size: 14px; } #menu p { opacity: .7; margin: 0 0 6px; }
  #menu .row { display: grid; grid-template-columns: 1fr 150px 74px; gap: 10px; align-items: center; padding: 3px 0; }
  #menu .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 18px 0 30px; } #menu .actions button { margin: 0; }
  #menu details { border-top: 1px solid rgba(255,255,255,.12); padding: 2px 0; }
  #menu summary { cursor: pointer; color: #e8a23a; font-weight: 700; font-size: 14px; padding: 8px 0; }
  #menu input.search { width: 100%; box-sizing: border-box; font: inherit; padding: 7px 9px; border-radius: 6px; border: 0; margin: 6px 0 8px; }
  #menu .seed { border-top: 1px solid rgba(255,255,255,.12); padding: 6px 0 4px; }
  #menu .seedrow { display: grid; grid-template-columns: 1fr 130px auto; gap: 10px; align-items: center; }
  #menu .seedrow input { font: inherit; padding: 5px 7px; border-radius: 4px; border: 0; min-width: 0; }
  #menu .seedrow button { margin: 0; }
  #menu .seed p { margin: 4px 0 0; }
  #menu input[type=number] { width: 70px; font: inherit; padding: 3px 4px; border-radius: 4px; border: 0; }
  #menu input[type=checkbox] { justify-self: start; width: 18px; height: 18px; }
  #menu button.go { margin: 8px 0 4px; background: #e8a23a; font-weight: 700; }
  #menu button { margin: 18px 0 30px; font: inherit; padding: 8px 12px; border-radius: 6px; border: 0; cursor: pointer; }
  #lobby { position: fixed; z-index: 15; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20,28,18,.92); }
  #lobby .box { width: min(92vw, 460px); text-align: center; }
  #lobby h1 { font-size: 40px; margin: 0 0 4px; letter-spacing: 2px; }
  #lobby p { opacity: .8; margin: 6px 0 18px; }
  #lobby button, #lobby input { font: inherit; font-size: 20px; padding: 12px 16px; margin: 6px; border-radius: 8px; border: 0; }
  #lobby button { background: #e8a23a; color: #201400; font-weight: 700; cursor: pointer; min-width: 150px; }
  #lobby button.alt { background: #4a5d42; color: #fff; font-size: 16px; padding: 8px 14px; min-width: 0; }
  #lobby button:focus, #lobby input:focus { outline: 3px solid #fff; }
  #lobby input { width: 130px; text-transform: uppercase; text-align: center; }
  #lobby input#seed { width: 170px; text-transform: none; }
  #lobby input#pname { width: 170px; text-transform: none; }
  #lobby input#pcolor { width: 56px; height: 48px; padding: 4px; vertical-align: middle; cursor: pointer; background: #4a5d42; }
  #lobby label { opacity: .8; font-size: 15px; }
  #msg { min-height: 1.4em; color: #ffd27a; }
  #help { font-size: 12.5px; opacity: .75; margin-top: 16px; text-align: left; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "rapier": "./vendor/rapier/rapier.mjs" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="status" class="hud"></div>
<div id="prog" class="hud"></div>
<div id="net" class="hud"></div>
<div id="toasts" class="hud"></div>
<div id="cross" class="hud"></div>
<svg id="ring" class="hud" viewBox="0 0 40 40"><circle id="ringArc" cx="20" cy="20" r="16" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".85" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="display:none;filter:drop-shadow(0 0 1.5px #000)"/></svg>
<div id="prompt" class="hud"></div>
<div id="rope" class="hud"></div>
<div id="keys" class="hud"></div>
<div id="menu"></div>
<div id="lobby"><div class="box">
  <h1>ARBORISM</h1>
  <p>co-op tree work &middot; physics prototype</p>
  <div><label for="pname">Name</label> <input id="pname" maxlength="16" placeholder="your name" autocomplete="off" spellcheck="false"> <label for="pcolor">Shirt</label> <input id="pcolor" type="color" value="#e8a23a"></div>
  <div><label for="seed">Seed</label> <input id="seed" maxlength="32" autocomplete="off" spellcheck="false"> <button id="bSeed" class="alt" title="A new random seed">New</button></div>
  <div><button id="bHost">Host</button> <button id="bSolo">Solo</button></div>
  <div><button id="bTest" class="alt">Testing</button></div>
  <div><input id="code" maxlength="5" placeholder="CODE" autocomplete="off"> <button id="bJoin">Join</button></div>
  <div id="msg"></div>
  <div id="help"></div>
</div></div>
<script src="./vendor/peerjs/peerjs.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
